name: echo_garden
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  uuid: ^4.3.3
  flame: ^1.14.0
  flame_audio: ^2.1.8
  vibration: ^3.2.1
  json_annotation: ^4.8.1
  path_provider: ^2.1.2
  flutter_tts: ^4.2.5
  flutter_localizations:
    sdk: flutter
  flutter_soloud: ^3.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  json_serializable: ^6.7.1
  build_runner: ^2.4.8

